<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<base target="_top">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F7F5; --card:#FFF; --ink:#17242A; --muted:#5C6B6A;
    --teal:#0E7C7B; --teal-d:#0B6362; --teal-soft:#E3F0EF;
    --line:#D4DBD9; --line-soft:#EDF1F0;
    --amber:#B0731C; --violet:#6E4FA0; --stamp:#B3402A; --plum:#8C2F52; --slate:#3E6B8C;
    --leave-bg:#FBF3E2; --leave:#8A6D3B; --ok:#1D7A4C; --radius:9px;

    /* ═══ ระบบขนาดตัวอักษร (ปรับได้ 3 ระดับสำหรับผู้มีปัญหาสายตา) ═══
       ทุกอย่างอิงจาก --fs ตัวเดียว ทั้งตัวอักษร ระยะห่าง และชิป
       จึงขยายพร้อมกันทั้งชุด layout ไม่พัง                            */
    --fs:15px;          /* ขนาดฐาน */
    --lh:1.5;           /* ความสูงบรรทัด */
    --pad-cell:7px 8px; /* ระยะในเซลล์ตาราง */
    --tbl-min:860px;    /* ความกว้างต่ำสุดของตาราง */
    --chip-fs:.72rem;
  }
  /* ระดับใหญ่ — เพิ่มทั้งขนาด ระยะห่าง และความกว้างตาราง */
  body.fs-lg{
    --fs:18px; --lh:1.62; --pad-cell:10px 11px; --tbl-min:1020px; --chip-fs:.78rem;
  }
  /* ระดับใหญ่พิเศษ */
  body.fs-xl{
    --fs:21px; --lh:1.7; --pad-cell:13px 13px; --tbl-min:1180px; --chip-fs:.82rem;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Sarabun',sans-serif;background:var(--paper);color:var(--ink);
    line-height:var(--lh);font-size:var(--fs)}
  .topbar{position:sticky;top:0;z-index:40;background:var(--card);
    border-bottom:1px solid var(--line);padding:10px 14px}
  .topbar h1{font-family:'Prompt',sans-serif;font-size:1.02rem;font-weight:600}
  .topbar h1 span{color:var(--teal)}
  .rowflex{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
  input[type=date]{font-family:'Sarabun',sans-serif;font-size:15px;padding:7px 9px;
    border:1px solid var(--line);border-radius:7px;min-height:38px}
  .btn{font-family:'Prompt',sans-serif;font-weight:600;font-size:.86rem;padding:8px 13px;
    border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);
    cursor:pointer;min-height:38px}
  .btn.primary{background:var(--teal);color:#fff;border-color:var(--teal)}
  .pill{font-size:.82em;font-weight:600;border-radius:999px;padding:5px 13px}

  /* ── กลุ่มปุ่มปรับขนาดตัวอักษร ── */
  .fsgroup{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);
    border-radius:9px;padding:3px 4px 3px 10px;background:var(--card)}
  .fslabel{font-size:.76em;color:var(--muted);font-weight:600;margin-right:5px;white-space:nowrap}
  .fsbtn{font-family:'Sarabun',sans-serif;font-weight:700;color:var(--muted);
    background:transparent;border:none;border-radius:7px;cursor:pointer;
    min-width:38px;min-height:36px;line-height:1;transition:background .15s,color .15s}
  .fsbtn:hover{background:var(--teal-soft);color:var(--teal-d)}
  .fsbtn:focus-visible{outline:3px solid var(--teal-soft);outline-offset:1px}
  .fsbtn.on{background:var(--teal);color:#fff}
  /* ขนาดตัว ก บอกระดับด้วยสายตา */
  #fs-sm{font-size:14px} #fs-lg{font-size:19px} #fs-xl{font-size:24px}
  @media print{.fsgroup{display:none!important}}
  .pill.locked{background:#E2F0E8;color:var(--ok)}
  .pill.open{background:var(--leave-bg);color:var(--leave)}
  .wrap{max-width:960px;margin:0 auto;padding:12px 12px 40px}
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px}
  .stat b{display:block;font-family:'Prompt',sans-serif;font-size:1.55em;color:var(--teal-d);font-weight:700}
  .stat small{font-size:.8em;color:var(--muted)}
  .shifthead{font-family:'Prompt',sans-serif;font-weight:600;font-size:1.08em;
    color:var(--teal-d);margin:18px 0 9px;display:flex;align-items:center;gap:8px}
  .shifthead::before{content:'';width:9px;height:18px;background:var(--teal);border-radius:3px}
  /* ── กล่องเวร สีพาสเทลแยกกะ ── */
  .shiftsec{border-radius:12px;padding:4px 12px 12px;margin-bottom:18px;border:1px solid transparent}
  .shiftsec .shifthead{margin-top:12px}
  /* เวรเช้า = เขียวพาสเทล */
  .shiftsec.sh-morning{background:#EAF6EE;border-color:#BFE3CC}
  .shiftsec.sh-morning .shifthead{color:#2E7D4F}
  .shiftsec.sh-morning .shifthead::before{background:#4CAF7D}
  /* เวรบ่าย = ชมพูพาสเทล */
  .shiftsec.sh-afternoon{background:#FCEEF3;border-color:#F3CBDB}
  .shiftsec.sh-afternoon .shifthead{color:#B33A6A}
  .shiftsec.sh-afternoon .shifthead::before{background:#E06B95}
  /* เวรดึก = ฟ้าพาสเทล */
  .shiftsec.sh-night{background:#EAF2FB;border-color:#C3D9F0}
  .shiftsec.sh-night .shifthead{color:#2F6BAF}
  .shiftsec.sh-night .shifthead::before{background:#5B93D6}
  /* การ์ดตารางในกล่องเวรใช้พื้นขาวเพื่ออ่านง่าย */
  .shiftsec .vteam{background:#fff}
  .vteam{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:12px;overflow:hidden}
  .vteam h4{font-family:'Prompt',sans-serif;font-size:1.02em;background:var(--teal-soft);
    color:var(--teal-d);padding:9px 13px}
  /* ── สีทีมขึ้นกับเวร: ทุกทีมอยู่ในโทนเดียวกับเวร ไล่เฉดแยกทีม 1/2/คนงาน ── */
  /* เวรเช้า — โทนเขียว */
  .sh-morning .vteam.t1{border-left:4px solid #3E9E6E}.sh-morning .vteam.t1 h4{background:#D6EEDF;color:#256B47}
  .sh-morning .vteam.t2{border-left:4px solid #6FB98C}.sh-morning .vteam.t2 h4{background:#E6F4EC;color:#2E7D4F}
  .sh-morning .vteam.t3{border-left:4px solid #A7CDB5}.sh-morning .vteam.t3 h4{background:#EFF7F2;color:#3E7A57}
  /* เวรบ่าย — โทนชมพู */
  .sh-afternoon .vteam.t1{border-left:4px solid #D65A85}.sh-afternoon .vteam.t1 h4{background:#F8DAE5;color:#A82F5C}
  .sh-afternoon .vteam.t2{border-left:4px solid #E68AA8}.sh-afternoon .vteam.t2 h4{background:#FCE7EE;color:#B33A6A}
  .sh-afternoon .vteam.t3{border-left:4px solid #EFB6C9}.sh-afternoon .vteam.t3 h4{background:#FDF0F4;color:#BF547E}
  /* เวรดึก — โทนฟ้า */
  .sh-night .vteam.t1{border-left:4px solid #3F7EC4}.sh-night .vteam.t1 h4{background:#D5E4F5;color:#265F9E}
  .sh-night .vteam.t2{border-left:4px solid #6E9FD6}.sh-night .vteam.t2 h4{background:#E4EEF9;color:#2F6BAF}
  .sh-night .vteam.t3{border-left:4px solid #A6C3E4}.sh-night .vteam.t3 h4{background:#EEF4FB;color:#3E76B5}
  /* ค่าเริ่มต้น (เผื่อไม่อยู่ในกล่องเวร) */
  .vteam.t1{border-left:4px solid #2E9B99}.vteam.t1 h4{background:#DCEEED;color:#0B6362}
  .vteam.t2{border-left:4px solid #C98A2B}.vteam.t2 h4{background:#FBF0DC;color:#8A5A16}
  .vteam.t3{border-left:4px solid #7E5FA8}.vteam.t3 h4{background:#EDE6F3;color:#5B4680}
  /* ── เฉดแถวตามระดับ RN/PN/คนงาน (ต่างกันเล็กน้อย โทนเดียวกับเวร) ── */
  .sh-morning tbody tr.lv-rn td{background:#EAF6EF}
  .sh-morning tbody tr.lv-pn td{background:#F1F9F4}
  .sh-morning tbody tr.lv-wk td{background:#F7FBF9}
  .sh-afternoon tbody tr.lv-rn td{background:#FCEAF1}
  .sh-afternoon tbody tr.lv-pn td{background:#FDF1F5}
  .sh-afternoon tbody tr.lv-wk td{background:#FEF7FA}
  .sh-night tbody tr.lv-rn td{background:#E9F1FB}
  .sh-night tbody tr.lv-pn td{background:#F1F6FC}
  .sh-night tbody tr.lv-wk td{background:#F7FAFD}
  /* แถวลา (เหลือง) ยังเด่นกว่าเฉดระดับเสมอ */
  .shiftsec tbody tr.leave td{background:var(--leave-bg)}
  .tblwrap{overflow-x:auto}
  /* table-layout:fixed + colgroup = ทุกทีมมีความกว้างคอลัมน์เท่ากันเป๊ะ
     (ถ้าไม่กำหนด เบราว์เซอร์จะคำนวณแยกแต่ละตาราง ทำให้ทีมที่ชื่อยาวคอลัมน์เตียงแคบจนตกบรรทัด) */
  table.view{width:100%;border-collapse:collapse;font-size:.88em;
    min-width:var(--tbl-min);table-layout:fixed}
  table.view th{text-align:left;font-size:.78em;color:var(--muted);padding:var(--pad-cell);
    border-bottom:1px solid var(--line);white-space:nowrap;background:#FBFCFB}
  table.view td{padding:var(--pad-cell);border-bottom:1px solid var(--line-soft);vertical-align:top;
    word-break:break-word}
  /* คอลัมน์แคบเหล่านี้ห้ามตกบรรทัดเด็ดขาด */
  table.view td.c-lvl,table.view td.c-bed,table.view td.c-brk,
  table.view td.c-fire,table.view td.c-sup{white-space:nowrap}
  /* ความกว้างคอลัมน์คงที่ (รวม = 100%) */
  col.w-name{width:18%}  col.w-lvl{width:5.5%} col.w-bed{width:7.5%}
  col.w-brk{width:7%}    col.w-fire{width:5%}  col.w-duty{width:19%}
  col.w-risk{width:17.5%} col.w-sup{width:6.5%} col.w-note{width:14%}
  tr.leave{background:var(--leave-bg)}
  .vchip{font-size:var(--chip-fs);font-weight:600;color:#fff;border-radius:999px;padding:2px 9px;
    margin:1px 2px 1px 0;display:inline-block;background:#6B7A78}
  .vchip.fall{background:var(--amber)}.vchip.pi{background:var(--violet)}
  .vchip.delirium{background:var(--stamp)}.vchip.violence{background:var(--plum)}.vchip.hip{background:var(--slate)}
  .badge{font-size:var(--chip-fs);font-weight:600;border-radius:6px;padding:2px 8px;display:inline-block;margin:1px 2px}
  .badge.ot{background:#FBEED9;color:var(--amber);border:1px solid var(--amber)}
  .badge.early{background:#E8F0F6;color:var(--slate);border:1px solid var(--slate)}
  .badge.train{background:#EFE8F5;color:var(--violet);border:1px solid var(--violet)}
  .badge.leave{background:#F0DFB8;color:var(--leave)}
  .badge.stud{background:#D6E5F1;color:var(--slate)}

  /* ═══ ขนาดใหญ่บนจอแคบ: เปลี่ยนตารางเป็นการ์ดแนวตั้ง ═══
     ผู้สูงอายุไม่ต้องเลื่อนซ้ายขวา อ่านไล่ลงมาได้เลย            */
  @media (max-width:1100px){
    body.fs-lg table.view, body.fs-xl table.view{min-width:0;display:block;table-layout:auto}
    body.fs-lg table.view thead, body.fs-xl table.view thead{display:none}
    body.fs-lg table.view tbody, body.fs-xl table.view tbody,
    body.fs-lg table.view tr, body.fs-xl table.view tr{display:block;width:100%}
    body.fs-lg table.view tr, body.fs-xl table.view tr{
      border-bottom:2px solid var(--line);padding:6px 0 10px}
    body.fs-lg table.view tr:last-child, body.fs-xl table.view tr:last-child{border-bottom:none}
    body.fs-lg table.view td, body.fs-xl table.view td{
      display:flex;gap:10px;align-items:flex-start;border:none;
      padding:4px 14px;white-space:normal}
    /* ป้ายกำกับหน้าเซลล์ (มาจาก data-label) */
    body.fs-lg table.view td::before, body.fs-xl table.view td::before{
      content:attr(data-label);flex:0 0 108px;color:var(--muted);
      font-weight:600;font-size:.86em}
    /* ชื่อ = หัวการ์ด ไม่ต้องมีป้าย */
    body.fs-lg table.view td.c-name, body.fs-xl table.view td.c-name{
      display:block;padding:8px 14px 4px;font-size:1.12em}
    body.fs-lg table.view td.c-name::before,
    body.fs-xl table.view td.c-name::before{content:none}
    /* ซ่อนเซลล์ที่ไม่มีข้อมูล ลดความรก */
    body.fs-lg table.view td.empty-cell,
    body.fs-xl table.view td.empty-cell{display:none}
    body.fs-lg .tblwrap, body.fs-xl .tblwrap{overflow-x:visible}
  }
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
    padding:36px;text-align:center;color:var(--muted)}
  .loading{text-align:center;padding:50px;color:var(--muted)}
  footer{font-size:.76rem;color:var(--muted);text-align:center;margin-top:22px}
  @media print{
    .topbar .rowflex,.btn{display:none!important}
    body{background:#fff}.wrap{max-width:100%;padding:0}
    .vteam{page-break-inside:avoid;border-radius:0}
    table.view{min-width:0}
    @page{size:A4 portrait;margin:11mm}
  }
  /* ═════════════════════════════════════════════════════════════
     ธีม UX ใหม่ — อ้างอิง DESIGN.md (Realsee guide)
     โทนฟ้าเป็นสีนำทาง · การ์ดขาวขอบมน 20–28px · เงาบางกว้าง · ปุ่มแคปซูล 48px
     *** คงสีเวรเช้า/บ่าย/ดึก สีทีมตามโทนเวร และเฉดแถว RN/PN/คนงาน ไว้ตามเดิม
         (กฎเหล่านั้นอยู่ด้านบน ใช้ selector ที่เจาะจงกว่า จึงไม่ถูกทับ) ***
     ═════════════════════════════════════════════════════════════ */
  :root{
    --paper:#f6f8fb; --card:#ffffff; --ink:#172033; --muted:#5b6b82;
    --line:#dbe4f0; --line-soft:#edf2f8;
    --teal:#2563eb; --teal-d:#1d4ed8; --teal-soft:#eaf2ff;   /* สีหลัก (ชื่อเดิม ค่าใหม่ = ฟ้า) */
    --radius:20px;
    --shadow:0 18px 44px rgba(15,23,42,.08);
    --shadow-sm:0 6px 20px rgba(15,23,42,.06);
    --ring:0 0 0 3px #bfdbfe;
  }
  body{background:var(--paper);color:var(--ink)}
  .wrap{max-width:1180px;padding:18px 16px 48px}
  @media(min-width:700px){.wrap{padding:22px 24px 56px}}

  /* ── Hero ── */
  .topbar.hero{position:static;max-width:1180px;width:calc(100% - 32px);margin:16px auto 0;
    background:var(--card);border:1px solid var(--line);border-radius:28px;
    box-shadow:var(--shadow);padding:22px 20px}
  @media(min-width:700px){.topbar.hero{width:calc(100% - 48px);padding:28px 30px}}
  .hero .eyebrow{display:inline-flex;align-items:center;gap:6px;font-family:'Prompt',sans-serif;
    font-weight:700;font-size:.78em;color:var(--teal-d);background:var(--teal-soft);
    padding:5px 12px;border-radius:999px}
  .hero h1{font-family:'Prompt',sans-serif;font-weight:800;line-height:1.12;color:var(--ink);
    font-size:calc(var(--fs) * 1.85);margin:12px 0 6px}
  @media(min-width:700px){.hero h1{font-size:calc(var(--fs) * 2.3)}}
  .hero h1 span{color:inherit}
  .hero .lede{color:var(--muted);font-size:.95em;margin-bottom:16px}
  .legend{display:inline-flex;flex-wrap:wrap;gap:6px;margin-left:4px;vertical-align:middle}
  .legend i{font-style:normal;font-size:.82em;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid}
  .legend .m{background:#EAF6EE;border-color:#BFE3CC;color:#2E7D4F}
  .legend .a{background:#FCEEF3;border-color:#F3CBDB;color:#B33A6A}
  .legend .n{background:#EAF2FB;border-color:#C3D9F0;color:#2F6BAF}

  /* ── ตัวควบคุม: ปุ่มแคปซูล 48px ── */
  .hero .rowflex{gap:10px;margin-top:0}
  .hero input[type=date]{min-height:48px;border-radius:999px;padding:0 18px;border-color:var(--line);
    background:#fff;color:var(--ink);font-size:15px}
  .btn{border-radius:999px;min-height:48px;padding:0 22px;font-weight:700;font-size:.92rem;
    border-color:var(--line);background:transparent;transition:transform .18s ease,background .18s ease,box-shadow .18s ease}
  .btn:hover{transform:translateY(-1px);background:#fff}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 10px 24px rgba(37,99,235,.22)}
  .btn.primary:hover{background:var(--teal-d)}
  .btn:focus-visible,.fsbtn:focus-visible,input[type=date]:focus-visible{outline:none;box-shadow:var(--ring)}
  .fsgroup{border-radius:999px;min-height:48px;padding:4px 5px 4px 14px;border-color:var(--line)}
  .fsbtn{border-radius:999px;min-width:40px;min-height:38px}
  .pill{padding:8px 14px}
  @media(max-width:699px){
    .hero .rowflex{display:grid;grid-template-columns:1fr 1fr}
    .hero input[type=date],.hero .fsgroup,.hero .pill{grid-column:1 / -1}
    .hero .btn{width:100%}
    .hero .fsgroup{justify-content:space-between}
  }

  /* ── หัววันที่ + KPI ── */
  .daytitle{font-family:'Prompt',sans-serif;font-weight:800;font-size:1.35em;margin:4px 0 14px;color:var(--ink)}
  .summary{gap:12px;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));margin-bottom:24px}
  .stat{border-radius:20px;border-color:var(--line);box-shadow:var(--shadow-sm);padding:16px 18px}
  .stat b{font-weight:800;font-size:2em;line-height:1.1;color:var(--teal-d)}
  .stat small{font-weight:700;font-size:.8em;color:var(--muted)}

  /* ── กล่องเวร (สีพาสเทลเดิม) ── */
  .shiftsec{border-radius:24px;padding:6px 18px 18px;margin-bottom:24px;box-shadow:var(--shadow-sm)}
  @media(max-width:699px){.shiftsec{padding:4px 10px 12px;border-radius:20px}}
  .shifthead{font-weight:800;font-size:1.3em;margin:16px 4px 14px}
  .shifthead::before{width:10px;height:26px;border-radius:999px}
  .shifthead .cnt{font-family:'Sarabun',sans-serif;font-size:.62em;font-weight:700;
    background:rgba(255,255,255,.75);border:1px solid rgba(23,32,51,.08);color:var(--ink);
    padding:3px 11px;border-radius:999px}
  .vteam{border-radius:20px;border-color:var(--line);box-shadow:0 2px 10px rgba(15,23,42,.04);margin-bottom:14px}
  .vteam h4{font-weight:800;padding:12px 16px}
  table.view th{background:#f8fafc;font-weight:700;border-bottom-color:var(--line)}
  table.view td{border-bottom-color:var(--line-soft)}
  .empty{border-radius:20px;border:1px dashed var(--line);background:#fff;padding:44px 24px}
  .loading{color:var(--muted)}
  footer{margin-top:28px;font-size:.78rem}

  /* ── พิมพ์: ตัดเงา คงสีเวรไว้บนกระดาษ ── */
  @media print{
    .topbar.hero{box-shadow:none;border:none;border-radius:0;margin:0;width:100%;padding:0 0 6px}
    .hero .eyebrow,.hero .lede{display:none}
    .hero h1{font-size:15pt;margin:0}
    .stat,.shiftsec,.vteam{box-shadow:none}
    .shiftsec,.vteam h4,table.view td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>

<header class="topbar hero">
  <span class="eyebrow">หอผู้ป่วยเฉลิมพระเกียรติ 7 ใต้ · สำหรับดูอย่างเดียว</span>
  <h1>ใบมอบหมายงานประจำวัน</h1>
  <p class="lede">เลือกวันที่เพื่อดูการจ่ายงาน แยกสีตามเวร
    <span class="legend"><i class="m">เช้า</i><i class="a">บ่าย</i><i class="n">ดึก</i></span></p>
  <div class="rowflex">
    <input type="date" id="pickDate">
    <button class="btn primary" onclick="load()">↻ รีเฟรช</button>
    <button class="btn" onclick="window.print()">🖨 พิมพ์ A4</button>
    <div class="fsgroup" role="group" aria-label="ปรับขนาดตัวอักษร">
      <span class="fslabel" aria-hidden="true">ขนาดอักษร</span>
      <button class="fsbtn on" id="fs-sm" onclick="setFS('sm')" aria-label="ขนาดปกติ">ก</button>
      <button class="fsbtn" id="fs-lg" onclick="setFS('lg')" aria-label="ขนาดใหญ่">ก</button>
      <button class="fsbtn" id="fs-xl" onclick="setFS('xl')" aria-label="ขนาดใหญ่พิเศษ">ก</button>
    </div>
    <span class="pill" id="lockpill" hidden></span>
  </div>
</header>

<div class="wrap">
  <div id="board"><div class="loading">กำลังโหลด…</div></div>
  <footer>อัปเดตล่าสุด <span id="updated">—</span> · หน้านี้ดูอย่างเดียว การจ่ายงานทำโดยหัวหน้าเวรเท่านั้น · โฮสต์บน GitHub Pages · รีเฟรชอัตโนมัติทุก 5 นาที</footer>
</div>

<script>
const TEAMS=['ทีม 1','ทีม 2','คนงาน'];
function teamCls(t){if(String(t).indexOf('1')>-1)return't1';if(String(t).indexOf('2')>-1)return't2';if(String(t).indexOf('คนงาน')>-1)return't3';return'';}
/* แยกสีพาสเทลตามเวร: เช้า=เขียว บ่าย=ชมพู ดึก=ฟ้า */
function shiftCls(s){if(s==='เวรเช้า')return'sh-morning';if(s==='เวรบ่าย')return'sh-afternoon';if(s==='เวรดึก')return'sh-night';return'';}
/* จำแนกระดับเป็นกลุ่มสำหรับไล่เฉดสีแถว */
function lvlCls(lv){lv=String(lv||'').toUpperCase();
  if(lv.indexOf('RN')>-1||lv==='HN')return'lv-rn';
  if(lv.indexOf('PN')>-1)return'lv-pn';
  if(lv.indexOf('คนงาน')>-1||lv.indexOf('นศ')>-1)return'lv-wk';
  return'';}
const SHIFTS=['เวรเช้า','เวรบ่าย','เวรดึก'];
const $=id=>document.getElementById(id);
/* ═══ วันที่ "วันนี้" ตามเวลาประเทศไทยเสมอ ═══
   เดิมใช้ new Date().toISOString() ซึ่งเป็นเวลา UTC (ช้ากว่าไทย 7 ชม.)
   ทำให้เปิดเว็บช่วง 00:00–06:59 น. ได้วันที่ของเมื่อวาน และสถิติรายเดือนผิดเดือน */
function todayTH(){
  try{
    const s=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
    if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  }catch(e){}
  return new Date(Date.now()+7*3600000).toISOString().slice(0,10);   // สำรอง: UTC+7
}
let autoDate=true;   // true = ระบบตั้งวันให้เอง (ผู้ใช้ยังไม่ได้เลือกวันอื่น)
$('pickDate').value=todayTH();
$('pickDate').addEventListener('change',()=>{autoDate=($('pickDate').value===todayTH());load();});
/* ถ้าเปิดค้างข้ามเที่ยงคืน → เลื่อนเป็นวันใหม่ (เฉพาะกรณีไม่ได้เลือกวันเอง) */
function rollDay(){const t=todayTH();if(autoDate&&$('pickDate').value!==t){$('pickDate').value=t;return true;}return false;}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){rollDay();load();}});
window.addEventListener('pageshow',e=>{if(e.persisted){rollDay();load();}});

/*DATA_LOADER_START*/
/* ⚙️ วาง URL ของ Web App (Apps Script → Deploy) ที่นี่ — ลงท้ายด้วย /exec */
const API_URL = 'https://script.google.com/macros/s/AKfycbwp7beLw-DotN8keXrfsd-DfjdC3qDnbzgTW46jqaVVUTLZA6l569KF_9alj28oJET3/exec';

async function load(){
  $('board').innerHTML='<div class="loading">กำลังโหลดข้อมูล…</div>';
  if(API_URL.includes('XXXX')){
    $('board').innerHTML='<div class="empty">ยังไม่ได้ตั้งค่า — เปิดไฟล์นี้แล้ววาง URL ของ Web App ในบรรทัด <b>const API_URL</b></div>';
    return;
  }
  const url=API_URL+'?api=1&date='+$('pickDate').value;
  try{
    const res=await fetch(url);
    if(!res.ok)throw new Error('HTTP '+res.status);
    render(await res.json());
  }catch(err){
    // สำรอง JSONP เผื่อเครือข่ายโรงพยาบาลบล็อก fetch
    const cb='cb_'+Date.now();
    window[cb]=d=>{render(d);delete window[cb];s.remove();};
    const s=document.createElement('script');
    s.src=url+'&callback='+cb;
    s.onerror=()=>{$('board').innerHTML='<div class="empty">เชื่อมต่อ API ไม่ได้ ('+esc(err.message)+') — ตรวจว่า Deploy แบบ Anyone และ URL ลงท้าย /exec</div>';delete window[cb];s.remove();};
    document.body.appendChild(s);
  }
}
/*DATA_LOADER_END*/

function render(data){
  $('updated').textContent=data.generatedAt||new Date().toLocaleString('th-TH');
  const pill=$('lockpill');
  pill.hidden=false;
  if(data.locked){pill.className='pill locked';pill.textContent='🔒 ยืนยันปิดวันแล้ว (ข้อมูลสมบูรณ์)';}
  else{pill.className='pill open';pill.textContent='⏳ ยังไม่ปิดวัน (อาจมีการแก้ไข)';}

  const recs=(data.records||[]).filter(r=>r['ชื่อบุคลากร']);
  if(!recs.length){
    $('board').innerHTML='<div class="empty"><b style="font-family:Prompt;display:block;margin-bottom:5px">ยังไม่มีการจ่ายงานของวันนี้</b>หัวหน้าเวรยังไม่ได้บันทึก — ลองรีเฟรชภายหลัง</div>';
    return;
  }
  const thai=new Date($('pickDate').value+'T00:00:00')
    .toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  // สรุปยอด
  const active=recs.filter(r=>r['สถานะ']!=='ลากิจ'&&r['สถานะ']!=='ลาป่วย');
  const leave=recs.length-active.length;
  const ot=recs.filter(r=>String(r['เวลาปฏิบัติงาน']||'').indexOf('OT')>-1).length;
  const early=recs.filter(r=>String(r['เวลาปฏิบัติงาน']||'').indexOf('13.00')>-1).length;
  const train=recs.filter(r=>r['อบรมประชุม']).length;
  const risk=recs.filter(r=>(r.highrisk||[]).length).length;

  let html=`<h2 class="daytitle">${esc(thai)}</h2>`;
  html+=`<div class="summary">
    <div class="stat"><b>${active.length}</b><small>ขึ้นเวร</small></div>
    <div class="stat"><b>${leave}</b><small>ลา</small></div>
    <div class="stat"><b>${ot}</b><small>OT</small></div>
    <div class="stat"><b>${early}</b><small>ขึ้นก่อน 13.00</small></div>
    <div class="stat"><b>${train}</b><small>อบรม/ประชุม</small></div>
    <div class="stat"><b>${risk}</b><small>มี High risk</small></div></div>`;

  SHIFTS.forEach(s=>{
    const rows=recs.filter(r=>(r['เวร']||'เวรเช้า')===s);
    if(!rows.length)return;
    html+=`<div class="shiftsec ${shiftCls(s)}">`;
    html+=`<div class="shifthead">${s} <span class="cnt">${rows.length} คน</span></div>`;
    const teamNames=[...TEAMS.filter(t=>rows.some(r=>r['ทีม']===t)),
      ...[...new Set(rows.map(r=>r['ทีม']))].filter(t=>!TEAMS.includes(t))];
    teamNames.forEach(team=>{
      const list=rows.filter(r=>r['ทีม']===team);if(!list.length)return;
      html+=`<div class="vteam ${teamCls(team)}"><h4>${esc(team)}</h4><div class="tblwrap"><table class="view">
        <colgroup><col class="w-name"><col class="w-lvl"><col class="w-bed"><col class="w-brk"><col class="w-fire"><col class="w-duty"><col class="w-risk"><col class="w-sup"><col class="w-note"></colgroup>
        <thead><tr>
        <th>ชื่อ</th><th>ระดับ</th><th>เตียง</th><th>พัก</th><th>อัคคีภัย</th><th>ตรวจเยี่ยม</th><th>High risk</th><th>นิเทศ</th><th>สถานะ/พิเศษ</th></tr></thead><tbody>`;
      list.forEach(r=>{
        const isLeave=(r['สถานะ']==='ลากิจ'||r['สถานะ']==='ลาป่วย');
        const notes=[];
        const wt=String(r['เวลาปฏิบัติงาน']||'');
        if(wt&&wt!=='ปกติ')notes.push(`<span class="badge ${wt.indexOf('OT')>-1?'ot':'early'}">${wt.indexOf('OT')>-1?'⏱ ':''}${esc(wt)}</span>`);
        if(r['อบรมประชุม'])notes.push(`<span class="badge train">📋 ${esc(r['อบรมประชุม'])}</span>`);
        if(r['ระดับ']==='นศ.')notes.push('<span class="badge stud">นักศึกษาฝึก</span>');
        if(isLeave)notes.push(`<span class="badge leave">${esc(r['สถานะ'])}</span>`);
        else if(r['สถานะ']&&r['สถานะ']!=='ขึ้นเวร')notes.push(`<span class="badge early">${esc(r['สถานะ'])}</span>`);
        if(r['หน้าที่พิเศษ'])notes.push(esc(r['หน้าที่พิเศษ']));
        const mt=v=>(!v||v==='-')?' empty-cell':'';   // เซลล์ว่าง → ซ่อนในโหมดการ์ด
        const risks=(r.highrisk||[]).map(rk=>`<span class="vchip ${riskCls(rk)}">${esc(rk)}</span>`).join('');
        html+=`<tr class="${isLeave?'leave':''} ${lvlCls(r['ระดับ'])}">
          <td class="c-name"><b>${esc(r['ชื่อบุคลากร'])}</b>${r['หมายเหตุ']?`<br><small style="color:var(--muted)">${esc(r['หมายเหตุ'])}</small>`:''}</td>
          <td class="c-lvl" data-label="ระดับ">${esc(r['ระดับ']||'-')}</td>
          <td class="c-bed${mt(r['เตียงรับผิดชอบ'])}" data-label="เตียง"><b style="color:var(--teal-d)">${esc(r['เตียงรับผิดชอบ']||'-')}</b></td>
          <td class="c-brk" data-label="เวลาพัก">${esc(r['เวลาพัก']||'-')}</td>
          <td class="c-fire${mt(r['อัคคีภัย'])}" data-label="อัคคีภัย">${esc(r['อัคคีภัย']||'-')}</td>
          <td class="${mt(r['หน้าที่ตรวจเยี่ยม']).trim()}" data-label="ตรวจเยี่ยม">${esc(r['หน้าที่ตรวจเยี่ยม']||'-')}</td>
          <td class="${risks?'':'empty-cell'}" data-label="High risk">${risks||'-'}</td>
          <td class="c-sup${mt(r['ได้ทำนิเทศ'])}" data-label="นิเทศ">${esc(r['ได้ทำนิเทศ']||'-')}</td>
          <td data-label="สถานะ">${notes.join(' ')||'✓ ขึ้นเวร'}</td></tr>`;
      });
      html+=`</tbody></table></div></div>`;
    });
    html+=`</div>`;
  });
  $('board').innerHTML=html;
}

function riskCls(rk){const t=(rk||'').toLowerCase();
  if(t.includes('fall')||rk.includes('พลัดตก'))return'fall';
  if(t.includes('pi')||rk.includes('กดทับ'))return'pi';
  if(t.includes('delirium')||rk.includes('สับสน'))return'delirium';
  if(t.includes('violence')||rk.includes('รุนแรง'))return'violence';
  if(t.includes('hip'))return'hip';return'other';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ══════ ปรับขนาดตัวอักษร (จำค่าไว้ให้ผู้ใช้คนเดิม) ══════ */
function setFS(size){
  document.body.classList.remove('fs-lg','fs-xl');
  if(size==='lg')document.body.classList.add('fs-lg');
  if(size==='xl')document.body.classList.add('fs-xl');
  ['sm','lg','xl'].forEach(s=>{
    const b=$('fs-'+s); if(b)b.classList.toggle('on',s===size);
  });
  try{sessionStorage.setItem('ward7_fs',size);}catch(e){}
}
(function restoreFS(){
  let s='sm';
  try{s=sessionStorage.getItem('ward7_fs')||'sm';}catch(e){}
  setFS(s);
})();

load();
setInterval(()=>{rollDay();load();}, 5*60*1000); // รีเฟรชอัตโนมัติทุก 5 นาที
setInterval(()=>{if(rollDay())load();}, 60*1000);   // ตรวจขึ้นวันใหม่ทุก 1 นาที
</script>
</body>
</html>
